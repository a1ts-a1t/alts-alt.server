name: Deploy server executable

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  build-executable:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine3.22
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: apk add openssl-dev musl-dev openssl-libs-static

      - name: Build executable
        run: cargo build -r

      - name: Compress debug sections
        run: objcopy --compress-debug-sections target/release/server ./server

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            server
            Dockerfile
          if-no-files-found: error
          overwrite: true

  build-image:
    runs-on: ubuntu-latest
    needs: build-executable
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build

      - name: Build image
        run: |
          docker build -t alts-alt/server:prod \
            --build-arg SERVER_PORT=8000 \
            --build-arg WEBSITE_PORT=4321 \
            --build-arg WEBSITE_HOST=website \
            .

      - name: Export image
        run: docker save alts-alt/server:prod | gzip > server.tar.gz

      - name: Publish image artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: server.tar.gz
          if-no-files-found: error
          overwrite: true

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: server-image

      - name: Initialize ssh
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_NAME }} > ~/.ssh/known_hosts

      - name: Sync image
        run: |
          rsync -av --chmod=600 server.tar.gz ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }}:~/

      - name: Restart server
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }} "~/entrypoint.sh"

  verify:
    needs: deploy
    uses: ./.github/workflows/canary.yml
