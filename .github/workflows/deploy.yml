name: Deploy server executable

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4

      - name: Initialize ssh
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_NAME }} > ~/.ssh/known_hosts

      - name: Sync server executable
        run: rsync -av --delete --chmod=700 -p build/server ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }}:~/server

      - name: Sync server Dockerfile
        run: rsync -av --delete -p build/Dockerfile ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }}:~/server

      - name: Restart server
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }} "~/entrypoint.sh"

  verify:
    needs: deploy
    uses: ./.github/workflows/canary.yml

