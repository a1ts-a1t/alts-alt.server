name: Deploy server executable

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine3.22
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: apk add openssl-dev musl-dev openssl-libs-static

      - name: Build executable
        run: cargo build -r

      - name: Compress debug sections
        run: objcopy --compress-debug-sections target/release/server ./server

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            server
            Dockerfile
          if-no-files-found: error
          overwrite: true

  build-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build

      - name: Build image
        run: |
          docker build -t alts-alt/server:prod \
            --build-arg SERVER_PORT=8000 \
            --build-arg WEBSITE_PORT=4321 \
            --build-arg WEBSITE_HOST=website \
            .

      - name: Export image
        run: docker save alts-alt/server:prod | gzip > server-image.tar.gz

      - name: Publish image artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-image
          path: server-image.tar.gz
          if-no-files-found: error
          overwrite: true

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: server-image

      - name: Initialize ssh
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          for i in 1 2 3 4 5; do
            ssh-keyscan -H ${{ secrets.HOST_NAME }} > ~/.ssh/known_hosts && break
            echo "keyscan attempt $i failed, retrying in 10s"; sleep 10
          done
          test -s ~/.ssh/known_hosts
      - name: Ship image and restart
        run: |
          rsync -av --chmod=600 server-image.tar.gz ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }}:~/server/
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }} "~/entrypoint.sh ~/server/server-image.tar.gz"

  verify:
    needs: deploy
    uses: ./.github/workflows/canary.yml
