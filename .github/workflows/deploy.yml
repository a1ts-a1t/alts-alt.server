name: Deploy server executable

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:1-alpine3.22
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: apk add openssl-dev musl-dev openssl-libs-static

      - name: Build executable
        run: cargo build -r

      - name: Compress debug sections
        run: objcopy --compress-debug-sections target/release/server ./server

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            server
            Dockerfile
          if-no-files-found: error
          overwrite: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4

      - name: Initialize ssh
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOST_NAME }} > ~/.ssh/known_hosts

      - name: Sync server files
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }} "mkdir -p ~/server"
          rsync -av --chmod=700 build/server ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }}:~/server/
          rsync -av build/Dockerfile ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }}:~/server/

      - name: Restart server
        run: |
          ssh ${{ secrets.USERNAME }}@${{ secrets.HOST_NAME }} "~/entrypoint.sh"

  verify:
    needs: deploy
    uses: ./.github/workflows/canary.yml
