[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = "0.12.23"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7", features = ["fs", "cors", "trace"] }
futures-util = "0.3"
kennel-club = { git = "https://github.com/a1ts-a1t/kennel-club.git" }
serde_json = "1.0.145"
rand = { version = "0.9.2", features = ["std_rng"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
hyper-util = "0.1.20"
moka = { version = "0.12", features = ["future"] }
bytes = "1"
hyper-tls = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = "1.11.1"
